name: iOS → TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'fr.odysseemots.app' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          trap 'echo "::error::Échec : $BASH_COMMAND"' ERR
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          [ -z "${WORKER_URL}" ] && missing="$missing WORKER_URL(variable)"
          if [ -n "$missing" ]; then echo "::error::Secrets manquants :$missing"; exit 1; fi
          [ -z "${RC_APPLE_KEY}" ] && echo "::warning::RC_APPLE_KEY absent : l'abonnement sera désactivé dans cette version."
          true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          WORKER_URL: ${{ vars.WORKER_URL || secrets.WORKER_URL }}
          RC_APPLE_KEY: ${{ secrets.RC_APPLE_KEY }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Créer le projet iOS
        run: |
          trap 'echo "::error::Échec : $BASH_COMMAND"' ERR
          flutter create . --platforms=ios --project-name odyssee_mots --org fr.odysseemots > create.log 2>&1 || { tail -20 create.log | while read -r l; do echo "::warning::$l"; done; exit 1; }
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = fr.odysseemots.odysseeMots;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" $PBX
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" $PBX
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Odyssée Mots" $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion fr" $P
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" $P
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string fr" $P
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" $PBX | head -3

      - name: Dépendances et icône
        run: |
          trap 'echo "::error::Échec : $BASH_COMMAND"' ERR
          flutter pub get > pub.log 2>&1 || { tail -20 pub.log | while read -r l; do echo "::warning::$l"; done; exit 1; }
          dart run flutter_launcher_icons > icons.log 2>&1 || { tail -20 icons.log | while read -r l; do echo "::warning::$l"; done; exit 1; }

      - name: Préparer la compilation
        run: |
          flutter build ios --config-only --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=WORKER_URL=${{ vars.WORKER_URL || secrets.WORKER_URL }} \
            --dart-define=RC_APPLE_KEY=${{ secrets.RC_APPLE_KEY }} > config.log 2>&1 || {
              tail -30 config.log | while read -r l; do echo "::error::$l"; done; exit 1; }
          # Si le projet utilise encore CocoaPods, on fixe iOS 15 minimum.
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
            (cd ios && pod install > ../pod.log 2>&1) || { tail -25 pod.log | while read -r l; do echo "::error::$l"; done; exit 1; }
          fi
          ls ios

      - name: Clé App Store Connect
        run: |
          trap 'echo "::error::Échec : $BASH_COMMAND"' ERR
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive signée
        run: |
          trap 'echo "::error::Échec : $BASH_COMMAND"' ERR
          set -o pipefail
          if [ -d ios/Runner.xcworkspace ]; then PROJ="-workspace ios/Runner.xcworkspace"; else PROJ="-project ios/Runner.xcodeproj"; fi
          xcodebuild $PROJ -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            archive > archive.log 2>&1 || {
              grep -E "error:|Error|requires a provisioning|No Accounts|No profiles" archive.log | sort -u | head -25 | while read -r l; do echo "::error::$l"; done
              tail -15 archive.log | while read -r l; do echo "::warning::$l"; done
              exit 1; }
          tail -3 archive.log

      - name: Certificat et profil de distribution
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          trap 'echo "::error::Échec : $BASH_COMMAND"' ERR
          P8=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          python3 -c "import json,os,sys; json.dump({'key_id':os.environ['ASC_KEY_ID'],'issuer_id':os.environ['ASC_ISSUER_ID'],'key':open(sys.argv[1]).read(),'in_house':False}, open(sys.argv[2],'w'))" $P8 $RUNNER_TEMP/asc.json
          PASS=$(shasum -a 256 $P8 | cut -c1-48)
          KC=$RUNNER_TEMP/signature.keychain-db
          security create-keychain -p temp $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p temp $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          mkdir -p ios-signing
          if [ -f ios-signing/distribution.p12.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in ios-signing/distribution.p12.enc -out $RUNNER_TEMP/dist.p12 -pass pass:$PASS
            security import $RUNNER_TEMP/dist.p12 -k $KC -P "" -T /usr/bin/codesign -T /usr/bin/security
          else
            # Première fois : on crée un certificat de distribution signé ici,
            # puis on le garde chiffré dans le dépôt pour les fois suivantes.
            fastlane run get_certificates api_key_path:$RUNNER_TEMP/asc.json development:false \
              output_path:$RUNNER_TEMP/certs keychain_path:$KC keychain_password:temp > cert.log 2>&1 || {
                tail -20 cert.log | while read -r l; do echo "::error::$l"; done; exit 1; }
            ls $RUNNER_TEMP/certs | while read -r l; do echo "::notice::certificat : $l"; done
            P12=$(ls $RUNNER_TEMP/certs/*.p12 | head -1)
            cp "$P12" $RUNNER_TEMP/dist.p12
            openssl enc -aes-256-cbc -pbkdf2 -salt -in $RUNNER_TEMP/dist.p12 -out ios-signing/distribution.p12.enc -pass pass:$PASS
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add ios-signing/distribution.p12.enc
            git commit -m "Certificat de distribution iOS (chiffré) [skip ci]"
            git push
          fi
          # Chaîne de confiance Apple (intermédiaire WWDR) : sans elle, l'identité est jugée invalide.
          curl -sSL -o $RUNNER_TEMP/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -sSL -o $RUNNER_TEMP/AppleWWDRCAG6.cer https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KC -T /usr/bin/codesign || true
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KC -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp $KC > /dev/null
          echo "::notice::Identités (toutes) :"
          security find-identity -p codesigning $KC | head -5 | while read -r l; do echo "::notice::$l"; done
          security find-identity -v -p codesigning $KC | head -3 | while read -r l; do echo "::notice::valide: $l"; done
          fastlane run get_provisioning_profile api_key_path:$RUNNER_TEMP/asc.json app_identifier:$BUNDLE_ID \
            output_path:$RUNNER_TEMP/profiles filename:dist.mobileprovision > profile.log 2>&1 || {
              tail -20 profile.log | while read -r l; do echo "::error::$l"; done; exit 1; }
          PROF=$RUNNER_TEMP/profiles/dist.mobileprovision
          security cms -D -i $PROF > $RUNNER_TEMP/prof.plist
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/prof.plist)
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/prof.plist)
          for d in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$d" && cp $PROF "$d/$UUID.mobileprovision"
          done
          echo "::notice::Profil : $NAME"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Export de l'IPA
        run: |
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath $RUNNER_TEMP/export > export.log 2>&1 || {
              grep -E "error|Error" export.log | sort -u | head -10 | while read -r l; do echo "::error::$l"; done
              tail -10 export.log | while read -r l; do echo "::warning::$l"; done
              exit 1; }
          IPA=$(ls $RUNNER_TEMP/export/*.ipa)
          mkdir -p $RUNNER_TEMP/check && cd $RUNNER_TEMP/check && unzip -q "$IPA"
          set +e +o pipefail
          codesign -vvvv --deep --strict Payload/Runner.app 2>&1 | tail -3 | while read -r l; do echo "::notice::$l"; done
          echo "IPA=$IPA" >> $GITHUB_ENV

      - name: Envoi vers TestFlight
        run: |
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }} > upload.log 2>&1 || {
              grep -iE "error|fail" upload.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done
              tail -10 upload.log | while read -r l; do echo "::warning::$l"; done
              exit 1; }
          tail -3 upload.log
          echo "::notice::Build ${{ github.run_number }} envoyée à App Store Connect. Elle apparaîtra dans TestFlight après traitement (10 à 30 min)."
