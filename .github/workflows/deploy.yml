name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compléter les fichiers de plateforme manquants
        run: flutter create . --platforms=web --project-name odyssee_mots --org fr.odysseemots

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyse.txt 2>&1
          code=$?
          cat analyse.txt
          grep -E "error •|warning •" analyse.txt | head -40 | while read -r l; do echo "::warning::$l"; done
          exit $code

      - name: Tests
        run: |
          set +e
          flutter test > tests.txt 2>&1
          code=$?
          cat tests.txt
          [ $code -ne 0 ] && tail -30 tests.txt | while read -r l; do echo "::warning::$l"; done
          exit $code

      - name: Compilation web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=WORKER_URL=${{ vars.WORKER_URL || secrets.WORKER_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
