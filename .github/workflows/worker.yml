name: Mettre à jour le serveur Cloudflare

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déployer le Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: ${{ vars.KV_QUOTA_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$KV_ID" ]; then
            echo "::notice::Mise à jour automatique non configurée (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, KV_QUOTA_ID) : recolle worker.js à la main."
            exit 0
          fi
          cd worker
          cat > wrangler.ci.jsonc <<JSON
          {
            "name": "odyssee-mots",
            "main": "worker.js",
            "compatibility_date": "2026-10-01",
            "keep_vars": true,
            "ai": { "binding": "AI" },
            "kv_namespaces": [{ "binding": "QUOTA", "id": "${KV_ID}" }],
            "observability": { "enabled": true }
          }
          JSON
          npx --yes wrangler@4 deploy --config wrangler.ci.jsonc
